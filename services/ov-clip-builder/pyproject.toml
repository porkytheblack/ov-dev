[project]
name = "ov-clip-builder"
version = "1.0.0"
description = "Overwatch: incident clip builder with bounding-box overlays."
requires-python = ">=3.11"
dependencies = [
    "overwatch-shared-py",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "opencv-python-headless>=4.9.0.80",
    "numpy>=1.26.4",
    "redis>=5.0.4",
    "minio>=7.2.5",
    "psycopg[binary]>=3.1.18",
    "psycopg-pool>=3.2.0",
    "structlog>=24.1.0",
]

[tool.uv.sources]
overwatch-shared-py = { path = "../../packages/shared-py", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["overwatch_clip_builder"]

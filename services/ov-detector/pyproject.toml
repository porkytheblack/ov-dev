[project]
name = "ov-detector"
version = "1.0.0"
description = "Overwatch: YOLO11L + BoT-SORT detector."
requires-python = ">=3.11"
dependencies = [
    "overwatch-shared-py",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "opencv-python-headless>=4.9.0.80",
    "numpy>=1.26.4",
    "ultralytics>=8.2.0",
    # Linear-assignment solver the ByteTrack/BoT-SORT trackers need. Without
    # it ultralytics pip-installs it at runtime on the first frame ("Restart
    # runtime for updates to take effect"), stalling/destabilising the first
    # detections. Bake it into the image.
    "lap>=0.5.12",
    "redis>=5.0.4",
    "minio>=7.2.5",
    "structlog>=24.1.0",
    "pydantic>=2.7.1",
]

[tool.uv.sources]
overwatch-shared-py = { path = "../../packages/shared-py", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["overwatch_detector"]

[project]
name = "overwatch-shared-py"
version = "1.0.0"
description = "Shared Python utilities for the Overwatch vision plane."
requires-python = ">=3.11"
dependencies = [
    "redis>=5.0.4",
    "minio>=7.2.5",
    "pydantic>=2.7.1",
    "structlog>=24.1.0",
    "psycopg[binary]>=3.1.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["overwatch_shared"]
